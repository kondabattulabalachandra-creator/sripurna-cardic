# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/images
          cp index.html styles.css script.js robots.txt _site/
          cp sitemap.xml _site/sitemap.xml
          cp favicon.ico favicon.png favicon-32x32.png favicon-16x16.png apple-touch-icon.png _site/
          cp -R fonts _site/fonts
          mkdir -p _site/dr-srikanth-nakka
          cp dr-srikanth-nakka/index.html _site/dr-srikanth-nakka/index.html
          cp images/hero.webp images/dr-srikanth-nakka-clinic-portrait.webp images/dr-srikanth-nakka-at-sri-purna-cardiac-care.webp images/sri-purna-cardiac-care-logo-user.webp images/heart-diagram-en.svg _site/images/
          cp images/cardiac-care-team.webp images/community-health-event.webp images/dr-srikanth-nakka-cardiology-colleagues.webp images/dr-srikanth-nakka-cardiology-conference-panel.webp images/dr-srikanth-nakka-cardiology-conference.webp images/dr-srikanth-nakka-consultation.webp _site/images/
          cp images/cardiac-care-table-meeting.webp images/dr-srikanth-nakka-batch-colleagues.webp images/dr-srikanth-nakka-heart-day-recognition.webp images/dr-srikanth-nakka-yashoda-health-session.webp _site/images/
          cp -R images/responsive _site/images/responsive
          mkdir -p _site/images/services _site/vendor
          cp -R images/services/. _site/images/services/
          mkdir -p _site/images/journey
          cp -R images/journey/. _site/images/journey/
          cp -R vendor/bootstrap _site/vendor/
          cp -R know-your-heart _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
